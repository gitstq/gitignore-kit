[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitignore-kit"
version = "1.0.0"
description = "智能 .gitignore 生成与校验工具：本地模板库、技术栈自动识别、已跟踪文件违规检查 / Smart .gitignore generator and validator"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = ["gitignore", "git", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/gitstq/gitignore-kit"
Issues = "https://github.com/gitstq/gitignore-kit/issues"

[project.scripts]
gikit = "gitignore_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitignore_kit = ["data/templates/*.gitignore"]
